name: Deploy news website to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jhb-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run test:migration
      - name: Build external hosting version
        run: bun run build:vps
        env:
          VITE_SUPABASE_URL: ${{ secrets.EXTERNAL_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXTERNAL_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.EXTERNAL_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXTERNAL_SUPABASE_PUBLISHABLE_KEY }}
      - name: Prepare release
        run: tar -czf /tmp/jhb-release.tgz .output scripts/refresh-youtube.mjs scripts/youtube-rules.mjs package.json bun.lock deploy/activate-release.sh
      - name: Deploy over verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes /tmp/jhb-release.tgz "$VPS_USER@$VPS_HOST:/tmp/jhb-${GITHUB_SHA}.tgz"
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p /srv/jhb/releases/${GITHUB_SHA} && tar -xzf /tmp/jhb-${GITHUB_SHA}.tgz -C /srv/jhb/releases/${GITHUB_SHA} && cd /srv/jhb/releases/${GITHUB_SHA} && /usr/local/bin/bun install --production --frozen-lockfile && bash deploy/activate-release.sh ${GITHUB_SHA} && rm /tmp/jhb-${GITHUB_SHA}.tgz"